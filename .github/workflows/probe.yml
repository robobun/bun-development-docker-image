name: Probe generated bake script

on:
  push:
    branches:
      - "robobun/1e86f878/probe"

permissions:
  contents: read

jobs:
  reach:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        instance: [1, 2]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Requests to apt.llvm.org from docker build, with and without retry defaults
        run: docker build --progress=plain --no-cache -f probe/Dockerfile.reach probe
